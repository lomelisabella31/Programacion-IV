{% extends "base.html" %}

{% block contenido %}

<h2>Editar libro</h2>

<form method="post">
    <input name="titulo" value="{{libro.titulo}}"><br>
    <input name="autor" value="{{libro.autor}}"><br>
    <input name="genero" value="{{libro.genero}}"><br>
    <input name="estado" value="{{libro.estado}}"><br>
    <button>Guardar</button>
</form>

{% endblock %}
