<!DOCTYPE html>
<html>
<head>
    <title>biblioteca bella</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Biblioteca de bella</h1>

<a href="/agregar">Agregar libro</a>

<ul>
    {% for l in libros %}
        <li>
            {{l.titulo}} - {{l.autor}} ({{l.genero}})
            <a href="/editar/{{l.id}}">editar</a>
            <a href="/eliminar/{{l.id}}">eliminar</a>
        </li>
    {% endfor %}
</ul>

</body>
</html>
